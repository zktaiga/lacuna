[project]
name = "lacuna-mcp"
version = "0.1.0"
description = "Local stdio MCP primitives for the existing Lacuna release"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "pydantic>=2.11,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
line-length = 100
